name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Continuous Integration (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Swift Companion (Library + NotchAgent Executable)
        run: swift build --package-path apps/macos

      - name: Bundle Standalone macOS Application (.app)
        run: pnpm run bundle:app

      - name: Test TS Monorepo & Packaging Smoke Test (Vitest + Coverage)
        run: pnpm test

      - name: Test Swift Companion (Swift Testing + Coverage)
        run: swift test --package-path apps/macos --enable-code-coverage
